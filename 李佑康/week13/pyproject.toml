[project]
name = "progressive-skill-harness"
version = "0.1.0"
description = "一个支持渐进式发现、加载资源和执行 Skills 的轻量 Harness"
requires-python = ">=3.10"
dependencies = ["openai>=1.68.0"]

[project.scripts]
skill-harness = "skill_harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["skill_harness*"]
