<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>图编排 Supervisor · subagent 并行可视化</title>
<style>
  :root {
    --bg:#060912; --panel:rgba(20,30,55,0.55); --border:rgba(0,212,255,0.18);
    --cyan:#00d4ff; --blue:#4f8cff; --orange:#ffb020; --green:#2ee6a0;
    --red:#ff5c7a; --text:#d6e2f5; --muted:#7a8db5;
  }
  * { box-sizing:border-box; }
  body { font-family:"Microsoft YaHei",Calibri,sans-serif; margin:0; color:var(--text);
         background:linear-gradient(135deg,#060912 0%,#0a1228 50%,#060912 100%);
         min-height:100vh; }
  .wrap { max-width:1300px; margin:0 auto; padding:16px; }
  h1 { margin:0 0 2px; font-size:22px; font-weight:700;
       background:linear-gradient(90deg,#00d4ff,#4f8cff,#b4a0ff);
       -webkit-background-clip:text; -webkit-text-fill-color:transparent; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .card { background:var(--panel); border:1px solid var(--border); border-radius:10px;
          padding:14px; margin-bottom:12px; backdrop-filter:blur(6px);
          box-shadow:0 0 24px rgba(0,120,200,0.05) inset, 0 4px 18px rgba(0,0,0,.35); }
  textarea { width:100%; border:1px solid var(--border); border-radius:7px; padding:10px;
            font-size:14px; background:rgba(8,14,30,0.7); color:var(--text); }
  textarea:focus { outline:none; border-color:var(--cyan); box-shadow:0 0 0 2px rgba(0,212,255,.15); }
  .ctrl { display:flex; align-items:center; gap:8px; margin-top:8px; flex-wrap:wrap; }
  button { background:linear-gradient(135deg,#1b3a7a,#2a5cd6); color:#fff; border:none;
           border-radius:6px; padding:7px 15px; cursor:pointer; font-size:13px;
           box-shadow:0 0 12px rgba(79,140,255,.25); transition:.2s; }
  button:hover { box-shadow:0 0 18px rgba(0,212,255,.5); transform:translateY(-1px); }
  button:disabled { background:#2a3354; box-shadow:none; cursor:default; opacity:.6; }
  .ex { background:rgba(20,40,80,.6); border:1px solid var(--border); color:var(--cyan);
        box-shadow:none; }
  .ex:hover { background:rgba(0,90,140,.4); }
  .spinner { width:14px; height:14px; border:2px solid rgba(0,212,255,.2);
             border-top:var(--cyan); border-radius:50%; animation:spin .8s linear infinite; display:none; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .routeline { font-size:12px; color:var(--cyan); margin-bottom:8px; padding:6px 10px;
               background:rgba(0,212,255,.06); border:1px solid var(--border); border-radius:6px; }
  .grid { display:grid; grid-template-columns: 400px 1fr; gap:12px; }
  .nodesel { font-size:11px; color:var(--muted); margin-bottom:8px; display:flex; flex-wrap:wrap; align-items:center; gap:4px; }
  .nodebtn { font-size:11px; padding:3px 9px; margin:2px; border-radius:10px;
             background:rgba(30,50,90,.5); color:var(--text); border:1px solid transparent; cursor:pointer; }
  .nodebtn.on { background:linear-gradient(135deg,#00d4ff,#4f8cff); color:#06122a; font-weight:700;
                box-shadow:0 0 10px rgba(0,212,255,.5); }
  .feed { max-height:560px; overflow-y:auto; padding-right:4px; }
  .feed::-webkit-scrollbar { width:6px; }
  .feed::-webkit-scrollbar-thumb { background:rgba(0,212,255,.3); border-radius:3px; }
  .step { border-left:3px solid var(--blue); background:rgba(10,18,40,.6);
          margin:6px 0; padding:7px 11px; border-radius:4px; font-size:12px; }
  .step.main { border-left-color:var(--cyan); }
  .step .nbadge { display:inline-block; font-size:9px; padding:1px 7px; border-radius:8px;
                   background:rgba(0,212,255,.15); color:var(--cyan); margin-right:6px; }
  .step.sub .nbadge { background:rgba(79,140,255,.18); color:var(--blue); }
  .step .thought { color:#9fb4e0; font-style:italic; margin:2px 0; }
  .step .act { color:var(--orange); font-weight:700; margin:2px 0; }
  .step .obs { color:#aab8d8; white-space:pre-wrap; word-break:break-word;
               max-height:120px; overflow-y:auto; background:rgba(4,8,20,.5);
               padding:4px 6px; border-radius:3px; margin-top:3px;
               font-family:Consolas,monospace; font-size:11px; }
  .step .fa { color:var(--green); font-weight:700; }
  .ans { font-size:14px; line-height:1.75; white-space:pre-wrap; }
  .stats { font-size:12px; color:var(--green); margin-top:8px; padding:6px 10px;
           background:rgba(46,230,160,.08); border-radius:5px; border:1px solid rgba(46,230,160,.2); }
  .stats .dim { color:var(--muted); }
  .status-tag { font-size:10px; padding:1px 7px; border-radius:8px; margin-left:6px; }
  .status-running { background:rgba(255,176,32,.18); color:var(--orange); }
  .status-done { background:rgba(46,230,160,.18); color:var(--green); }
  .legend { font-size:10px; color:var(--muted); margin-top:6px; line-height:1.8; }
  .legend i { display:inline-block; width:14px; height:0; border-top:2px solid; margin:0 3px; vertical-align:middle; }
</style>
</head>
<body>
<div class="wrap">
  <h1>▮ 图编排 Supervisor · subagent 并行可视化</h1>
  <div class="sub">确定性路由（代码定边）· plan 事件预画整张 DAG · 异构 worker 并行 · 凸显并行加速</div>

  <div class="card">
    <textarea id="q" rows="2">帮我调研一下中国咖啡市场现状，算一算近三年市场规模（2021年3817亿元、2022年4856亿元、2023年6188亿元）的年均增速，再写一篇 800 字左右的公众号推文，面向想开店创业的人</textarea>
    <div class="ctrl">
      <button id="ask" onclick="ask()">▶ 开始执行</button>
      <div id="spin" class="spinner"></div>
      <span style="font-size:12px;color:var(--muted)">预设：</span>
      <button class="ex" onclick="fill('帮我调研一下中国咖啡市场现状，算一算近三年市场规模（2021年3817亿元、2022年4856亿元、2023年6188亿元）的年均增速，再写一篇 800 字左右的公众号推文，面向想开店创业的人')">三 worker 复合</button>
      <button class="ex" onclick="fill('调研中国扫地机器人行业的市场规模与竞争格局；已知 2021-2023 年市场规模为 108/124/141 亿元，用工具计算同比增速和 CAGR')">双 worker 并行</button>
      <button class="ex" onclick="fill('调研一下中国扫地机器人行业竞争格局')">单 worker</button>
      <button class="ex" onclick="fill('写一篇新能源汽车行业科普推文，先调研行业现状')">纯依赖链</button>
      <button class="ex" onclick="fill('你好')">直答(零派发)</button>
    </div>
  </div>

  <div class="grid">
    <div class="card">
      <h3 style="margin:0 0 8px;font-size:14px;color:var(--cyan)">◆ 执行拓扑（plan 事件预画）</h3>
      <div id="routeline" class="routeline" style="display:none"></div>
      <div id="topo"></div>
      <div class="legend">
        <i style="border-color:#00d4ff"></i>派发边（supervisor→worker，代码路由）
        <i style="border-color:#ffb020"></i>依赖边（worker→worker，数据流）
        <i style="border-color:#5a6b8f"></i>回收边（结果回 supervisor）
      </div>
      <div class="stats" id="stats" style="display:none"></div>
    </div>
    <div class="card">
      <div class="nodesel" id="nodesel"></div>
      <div class="feed" id="feed"></div>
    </div>
  </div>

  <div class="card">
    <h3 style="margin:0 0 8px;font-size:14px;color:var(--cyan)">◆ 最终交付</h3>
    <div id="ans" class="ans">（执行后显示）</div>
  </div>
</div>

<script src="/static/viz/topology.js"></script>
<script>
let topo = null;
let allSteps = [];          // 全局有序步骤流：[{node, nodeType, step}]
let traces = {};            // {nodeId: [step]}
let nodeMeta = {};          // {id: {label, color, status}}
let currentNode = 'all';
let autoFollow = true;

function fill(q) { document.getElementById('q').value = q; }

async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const btn = document.getElementById('ask'), spin = document.getElementById('spin');
  btn.disabled = true; spin.style.display = 'inline-block';
  document.getElementById('ans').textContent = '（执行中…）';
  document.getElementById('stats').style.display = 'none';
  document.getElementById('routeline').style.display = 'none';
  allSteps = []; traces = {}; nodeMeta = {}; currentNode = 'all'; autoFollow = true;
  topo = new TopoViz(document.getElementById('topo'));
  topo.setMain();
  topo.onClick(id => selectNode(id));
  nodeMeta['supervisor'] = { label: '主 agent (Supervisor)', status: 'idle' };
  traces['supervisor'] = [];
  refreshNodeSel();
  document.getElementById('feed').innerHTML = '';

  try {
    const resp = await fetch('/query', { method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({question: q}) });
    const reader = resp.body.getReader(); const dec = new TextDecoder();
    let buf = '';
    while (true) {
      const {done, value} = await reader.read();
      if (done) break;
      buf += dec.decode(value, {stream:true});
      const lines = buf.split('\n\n'); buf = lines.pop();
      for (const ln of lines) {
        if (!ln.startsWith('data:')) continue;
        handleEvent(JSON.parse(ln.slice(5).trim()));
      }
    }
  } catch (e) {
    appendStep('supervisor', {action:'error', observation:String(e), final:false});
  } finally {
    btn.disabled = false; spin.style.display = 'none';
  }
}

function handleEvent(ev) {
  if (ev.type === 'plan') {
    topo.buildFromPlan(ev);
    const rl = document.getElementById('routeline');
    rl.textContent = '路由：' + ev.route_note + (ev.search_mode === 'knowledge' ? '（搜索降级：知识模式）' : '');
    rl.style.display = 'block';
    ev.stages.forEach(st => st.forEach(n => {
      traces[n.node_id] = []; nodeMeta[n.node_id] = { label: n.label, status: 'idle', color: n.color };
    }));
    refreshNodeSel();
  } else if (ev.type === 'node_start') {
    topo.markRunning(ev.node_id);
    if (nodeMeta[ev.node_id]) nodeMeta[ev.node_id].status = 'running';
    refreshNodeSel();
  } else if (ev.type === 'node_step') {
    pushStep(ev.node_id, 'sub', ev);
    topo.markRunning(ev.node_id);
  } else if (ev.type === 'node_done') {
    topo.markDone(ev.node_id);
    if (nodeMeta[ev.node_id]) nodeMeta[ev.node_id].status = ev.status === 'ok' ? 'done' : 'error';
    refreshNodeSel();
  } else if (ev.type === 'supervisor') {
    if (ev.phase === 'aggregate_start') topo.markRunning('supervisor');
  } else if (ev.type === 'stats') {
    const el = document.getElementById('stats');
    let html = '';
    ev.stages.forEach(s => {
      html += `stage${s.stage}：并行墙钟 <b>${s.wall_clock}s</b> vs 串行需 ${s.serial_sum}s `
        + `· 加速 <b style="color:var(--green)">${s.speedup}×</b><br>`;
    });
    html += `<b>端到端</b>：墙钟 <b style="color:var(--cyan)">${ev.total_wall_clock}s</b> `
      + `vs 串行等效 ${ev.total_serial_equiv}s · 加速 <b style="color:var(--green)">${ev.total_speedup}×</b>`;
    if (ev.aggregate_duration > 0 || ev.stages.length > 1) {
      html += `<br><span class="dim">（依赖边与聚合段串行，端到端加速低于 fan-out 段——Amdahl 瓶颈）</span>`;
    }
    el.innerHTML = html; el.style.display = 'block';
  } else if (ev.type === 'final') {
    document.getElementById('ans').textContent = ev.answer || '(无)';
    topo.markDone('supervisor');
    if (nodeMeta['supervisor']) nodeMeta['supervisor'].status = 'done';
    refreshNodeSel();
  } else if (ev.type === 'error') {
    document.getElementById('ans').textContent = '⚠ 执行出错：' + ev.message;
    document.getElementById('feed').innerHTML +=
      '<div class="step"><span class="nbadge">系统</span>⚠ ' + ev.message + '</div>';
  }
}

function pushStep(node, nodeType, step) {
  if (!traces[node]) { traces[node] = []; nodeMeta[node] = {label: node, status: 'running'}; }
  // 去重 by idx：pre-step(observation=null) 与 post-step(带 observation) 共享 idx，原地更新
  const tIdx = traces[node].findIndex(s => s.idx === step.idx);
  if (tIdx >= 0) traces[node][tIdx] = step; else traces[node].push(step);
  const aIdx = allSteps.findIndex(s => s.node === node && s.step.idx === step.idx);
  if (aIdx >= 0) allSteps[aIdx] = { node, nodeType, step };
  else allSteps.push({ node, nodeType, step });
  renderFeed();
}

function appendStep(node, step) {
  step.idx = (traces[node] || []).length;
  pushStep(node, node === 'supervisor' ? 'main' : 'sub', step);
}

function selectNode(id) {
  currentNode = id; autoFollow = (id === 'all');
  refreshNodeSel(); renderFeed();
}

function refreshNodeSel() {
  const sel = document.getElementById('nodesel');
  let html = '<span style="opacity:.6">节点：</span>';
  html += `<button class="nodebtn${currentNode==='all'?' on':''}" onclick="selectNode('all')">全部实时流</button>`;
  const ids = ['supervisor', ...Object.keys(nodeMeta).filter(id => id !== 'supervisor')];
  ids.forEach(id => {
    const m = nodeMeta[id] || {};
    const tag = m.status === 'done' ? '<span class="status-tag status-done">done</span>'
              : m.status === 'error' ? '<span class="status-tag" style="background:rgba(255,92,122,.18);color:var(--red)">err</span>'
              : m.status === 'running' ? '<span class="status-tag status-running">run</span>' : '';
    const lbl = (m.label || id).slice(0, 12);
    html += `<button class="nodebtn${currentNode===id?' on':''}" onclick="selectNode('${id}')">${lbl}${tag}</button>`;
  });
  sel.innerHTML = html;
}

function renderFeed() {
  const box = document.getElementById('feed');
  let steps;
  if (currentNode === 'all') steps = allSteps;
  else steps = (traces[currentNode]||[]).map(s => ({node:currentNode, nodeType: currentNode==='supervisor'?'main':'sub', step:s}));
  let html = '';
  steps.forEach(({node, nodeType, step: s}) => {
    const isMain = nodeType === 'main';
    const lbl = isMain ? '主agent' : (nodeMeta[node]?.label || node);
    const cls = isMain ? 'step main' : 'step sub';
    const t = s.thought ? `<div class="thought">💭 ${s.thought}</div>` : '';
    const a = s.action ? `<div class="act">🔧 ${s.action}${s.action_input ? '(' + s.action_input.slice(0,55) + ')' : ''}</div>` : '';
    const o = s.observation ? `<div class="obs">👁 ${s.observation}</div>`
            : (!s.final ? '<div class="obs" style="color:var(--orange)">⏳ 执行中…</div>' : '');
    const fa = s.final ? '<div class="fa">✓ 节点交付完成</div>' : '';
    html += `<div class="${cls}"><span class="nbadge">${lbl}</span>${t}${a}${o}${fa}</div>`;
  });
  if (!steps.length) html = '<div style="color:var(--muted);font-size:12px;padding:8px">等待步骤流…（点左侧节点或上方按钮可只看该节点）</div>';
  box.innerHTML = html;
  if (autoFollow) box.scrollTop = box.scrollHeight;
}
</script>
</body>
</html>
