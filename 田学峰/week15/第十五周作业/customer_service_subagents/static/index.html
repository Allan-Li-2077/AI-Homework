<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能客服 Subagent 并行调度</title>
<style>
:root{
  --bg:#0a0e1a; --panel:rgba(20,26,45,0.7); --border:rgba(100,130,255,0.2);
  --accent:#4f8cff; --green:#3ad29f; --orange:#ffb648; --pink:#ff6b9d;
  --text:#e6ebff; --dim:#8492b8; --mono:'JetBrains Mono','Cascadia Code',monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:linear-gradient(135deg,#0a0e1a 0%,#131a35 100%);color:var(--text);
  font-family:-apple-system,system-ui,'PingFang SC','Microsoft YaHei',sans-serif;min-height:100vh}
.app{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:16px;height:100vh}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:12px;
  backdrop-filter:blur(10px);padding:16px;overflow:hidden;display:flex;flex-direction:column}
.panel h2{font-size:14px;color:var(--accent);margin-bottom:12px;letter-spacing:1px;
  display:flex;align-items:center;gap:8px}
.panel h2::before{content:'';width:4px;height:14px;background:var(--accent);border-radius:2px}

/* 输入条 */
.bar{display:flex;gap:8px;margin-bottom:12px}
.bar input{flex:1;padding:10px 14px;background:rgba(10,15,30,0.6);
  border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:14px}
.bar input:focus{outline:none;border-color:var(--accent)}
.bar button{padding:10px 18px;background:var(--accent);color:#fff;border:none;
  border-radius:8px;cursor:pointer;font-weight:600;transition:all .2s}
.bar button:hover{box-shadow:0 0 16px rgba(79,140,255,0.6)}
.bar button:disabled{opacity:.5;cursor:not-allowed}
.preset{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.preset button{font-size:11px;padding:5px 10px;background:rgba(79,140,255,0.15);
  border:1px solid var(--border);border-radius:6px;color:var(--dim);cursor:pointer}
.preset button:hover{color:var(--accent);border-color:var(--accent)}

/* 拓扑 */
#topo{flex:1;background:rgba(5,8,18,0.4);border-radius:8px;position:relative;min-height:240px}
.stats{display:flex;gap:16px;margin-top:12px;font-size:12px;color:var(--dim)}
.stats span b{color:var(--green);font-family:var(--mono)}

/* 节点切换 */
.tabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.tabs button{font-size:11px;padding:4px 10px;background:rgba(255,255,255,0.04);
  border:1px solid var(--border);border-radius:6px;color:var(--dim);cursor:pointer}
.tabs button.active{background:var(--accent);color:#fff}
.tabs button.done{border-color:var(--green);color:var(--green)}

/* 过程流 */
.trace{flex:1;overflow-y:auto;padding-right:4px;font-family:var(--mono);font-size:12px}
.trace::-webkit-scrollbar{width:6px}
.trace::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.step{background:rgba(20,26,45,0.5);border-left:3px solid var(--accent);
  border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:8px;animation:fade .3s}
.step.sub{border-left-color:var(--pink)}
.step.done{border-left-color:var(--green)}
.step.final{border-left-color:var(--orange);background:rgba(255,182,72,0.08)}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
.badge{font-size:10px;color:var(--dim);margin-bottom:4px}
.badge span{color:var(--accent);font-weight:600}
.badge.sub span{color:var(--pink)}
.thought{color:#9db4ff;margin:4px 0;font-style:italic}
.action{color:var(--accent)}
.obs{color:var(--green);white-space:pre-wrap;word-break:break-all;
  background:rgba(58,210,159,0.05);padding:4px 6px;border-radius:4px;margin-top:4px}
.final-ans{background:rgba(255,182,72,0.08);border:1px solid var(--orange);
  padding:12px 14px;border-radius:8px;margin-top:8px;line-height:1.6;white-space:pre-wrap}
.meta{text-align:center;color:var(--dim);font-size:11px;margin-top:6px}
</style>
</head>
<body>
<div class="app">
  <!-- 左：输入 + 拓扑 -->
  <div class="panel">
    <h2>客服调度拓扑（主客服 + 并行子客服）</h2>
    <div class="bar">
      <input id="q" placeholder="输入客户问题，如：查 A100002 物流 + 给 A100003 退款 + 问退货政策">
      <button id="send" onclick="sendQ()">发送</button>
    </div>
    <div class="preset">
      <button onclick="setQ('帮我查下订单 A100002 物流到哪了，给 A100003 申请退款原因是商品质量问题，再问下退货政策')">查物流+退款+政策</button>
      <button onclick="setQ('查订单 A100001 物流状态，并问下保修期是多久，还有发票怎么开')">物流+保修+发票</button>
      <button onclick="setQ('A100004 还没发货吗？查下配送范围覆盖哪些地区，A100005 为什么退款了')">多订单+政策</button>
    </div>
    <div id="topo"></div>
    <div class="stats" id="stats">
      <span>子客服: <b id="n-sub">0</b></span>
      <span>墙钟: <b id="wall">-</b></span>
      <span>加速: <b id="speedup">-</b></span>
    </div>
  </div>

  <!-- 右：过程流 -->
  <div class="panel">
    <h2>ReAct 过程流（点节点切换视角）</h2>
    <div class="tabs" id="tabs"></div>
    <div class="trace" id="trace"></div>
    <div class="meta" id="meta"></div>
  </div>
</div>
<script src="viz/topology.js"></script>
<script>
const ROLE_COLOR={main:'#4f8cff',order:'#3ad29f',after_sale:'#ffb648',faq:'#9b6bff',escalation:'#ff6b9d'};
const ROLE_LABEL={main:'主客服',order:'订单专员',after_sale:'售后专员',faq:'政策专员',escalation:'升级专员'};
let topo=null;       // TopoViz 实例
let traces={main:[]}; // 各节点 trace 流
let subRoles={};     // sid -> role
let currentView='main';
let es=null;          // EventSource

function setQ(s){document.getElementById('q').value=s}
function $(id){return document.getElementById(id)}

function reset(){
  traces={main:[]}; subRoles={}; currentView='main';
  $('n-sub').textContent='0'; $('wall').textContent='-'; $('speedup').textContent='-';
  $('tabs').innerHTML=''; $('trace').innerHTML='';
  $('meta').textContent='等待处理...';
  topo=new TopoViz($('topo'));
  topo.addNode('main','主客服','#4f8cff',true);
  renderTabs();
}

function renderTabs(){
  const t=$('tabs'); t.innerHTML='';
  const allBtn=document.createElement('button');
  allBtn.textContent='全部实时流'; allBtn.className=currentView==='all'?'active':'';
  allBtn.onclick=()=>{currentView='all';renderTabs();renderTrace()};
  t.appendChild(allBtn);
  for(const id of ['main',...Object.keys(subRoles)]){
    const btn=document.createElement('button');
    const lbl=ROLE_LABEL[id]||id;
    btn.textContent=lbl;
    btn.className=(currentView===id?'active ':'')+(traces[id]&&traces[id].some(s=>s.final)?'done':'');
    const role=id==='main'?'main':subRoles[id];
    btn.style.borderColor=ROLE_COLOR[role]||'#4f8cff';
    btn.onclick=()=>{currentView=id;renderTabs();renderTrace()};
    t.appendChild(btn);
  }
}

function renderTrace(){
  const el=$('trace'); el.innerHTML='';
  let steps;
  if(currentView==='all'){
    steps=Object.entries(traces).flatMap(([id,arr])=>arr.map(s=>({...s,_node:id})));
  }else{
    steps=(traces[currentView]||[]).map(s=>({...s,_node:currentView}));
  }
  if(!steps.length){el.innerHTML='<div class="meta">暂无步骤，等待子客服执行...</div>';return}
  for(const s of steps){
    const div=document.createElement('div');
    const isSub=s._node!=='main';
    div.className='step '+(isSub?'sub ':'')+(s.done?'done ':'')+(s.final?'final':'');
    const role=isSub?subRoles[s._node]:'main';
    const lbl=ROLE_LABEL[role]||s._node;
    let html=`<div class="badge ${isSub?'sub':''}">[${lbl}] 步骤 ${s.idx}</div>`;
    if(s.thought) html+=`<div class="thought">💭 ${s.thought}</div>`;
    if(s.action){
      html+=`<div class="action">⚡ ${s.action}(${(s.action_input||'').slice(0,60)})</div>`;
    }
    if(s.observation){
      html+=`<div class="obs">📋 ${s.observation.slice(0,300)}</div>`;
    }
    if(s.final){
      html+=`<div class="final-ans">✅ ${s.action_input||''}</div>`;
    }
    div.innerHTML=html; el.appendChild(div);
  }
  el.scrollTop=el.scrollHeight;
}

function appendStep(node,step){
  if(!traces[node])traces[node]=[];
  traces[node].push(step);
  // 拓扑脉冲
  if(step.action==='dispatch_subagents'||step.action==='Final Answer'){
    topo.pulse(node,step.final);
  }
  if(currentView==='all'||currentView===node){renderTrace()}
  else if(currentView!=='all'){renderTabs()}
}

function sendQ(){
  const q=$('q').value.trim(); if(!q)return;
  $('send').disabled=true;
  reset();
  $('meta').textContent='主客服正在分析问题...';
  // POST + fetch 流读 SSE（标准 EventSource 只支持 GET，客服 query 较长需 POST）
  fetch('/query',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({question:q})}).then(resp=>{
    const reader=resp.body.getReader(); const dec=new TextDecoder();
    let buf='';
    const pump=()=>reader.read().then(({done,value})=>{
      if(done){finish();return}
      buf+=dec.decode(value);
      const parts=buf.split('\n\n'); buf=parts.pop();
      for(const part of parts){
        const lines=part.split('\n');
        let ev='',data='';
        for(const ln of lines){
          if(ln.startsWith('event:'))ev=ln.slice(6).trim();
          else if(ln.startsWith('data:'))data+=ln.slice(5).trim();
        }
        if(ev&&data)handle(ev,JSON.parse(data));
      }
      pump();
    });
    pump();
  }).catch(e=>{$('meta').textContent='错误: '+e;$('send').disabled=false});
}

function handle(ev,data){
  if(ev==='start'){$('meta').textContent='主客服开始处理...'}
  else if(ev==='main_step'){appendStep('main',data)}
  else if(ev==='dispatch'){
    data.subagent_ids.forEach((sid,i)=>{
      const role=data.roles[i];
      subRoles[sid]=role;
      topo.addNode(sid,ROLE_LABEL[role],ROLE_COLOR[role],false);
      topo.addEdge('main',sid);
      traces[sid]=[];
    });
    $('n-sub').textContent=Object.keys(subRoles).length;
    renderTabs();
  }
  else if(ev==='subagent_step'){
    appendStep(data.sid,data);
  }
  else if(ev==='subagent_done'){
    topo.markDone(data.sid);
    $('meta').textContent=`子客服完成: ${data.subtopic.slice(0,30)} (${data.duration}s)`;
  }
  else if(ev==='final'){
    $('wall').textContent=data.parallel_stats[0]?data.parallel_stats[0].wall_clock+'s':'-';
    $('speedup').textContent=data.parallel_stats[0]?data.parallel_stats[0].speedup+'×':'-';
    const fa=document.createElement('div'); fa.className='final-ans';
    fa.innerHTML='<b>客服答复：</b><br>'+data.answer.replace(/\n/g,'<br>');
    $('trace').appendChild(fa);
    $('trace').scrollTop=$('trace').scrollHeight;
    $('meta').textContent=`完成：${data.n_subagents} 个子客服并行处理`;
  }
  else if(ev==='error'){$('meta').textContent='错误: '+data.msg}
  else if(ev==='done'){finish()}
}

function finish(){
  $('send').disabled=false;
  if(es)es.close();
}
window.addEventListener('DOMContentLoaded',reset);
</script>
</body>
</html>
